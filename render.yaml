services:
  - type: web
    name: life-energy-api
    runtime: python
    rootDir: server
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: TELEGRAM_MODE
        value: webhook
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./data/app.db
      - key: CORS_ORIGINS
        value: "*"
      - key: APP_BASE_URL
        sync: false
      - key: YOOKASSA_SHOP_ID
        sync: false
      - key: YOOKASSA_SECRET_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        value: teacher_life_bot
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: METRIKA_COUNTER_ID
        value: "112323537"
      - key: METRIKA_MP_TOKEN
        sync: false
