<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Поведение на лендинге</title>
<style>
:root{
  --bg:#f3efe8;--ink:#1a1714;--muted:#6e675e;--line:rgba(26,23,20,.12);
  --card:#fffcf7;--good:#2a6b45;--warn:#9a5b20;--accent:#1f4d6e;--bar:#1f4d6e;--bar2:#2a6b45;
  --drop:#8a3a2a
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,sans-serif;background:
  radial-gradient(900px 400px at 10% -10%,rgba(31,77,110,.08),transparent),
  radial-gradient(700px 360px at 100% 0%,rgba(42,107,69,.07),transparent),
  var(--bg);color:var(--ink);padding:20px 14px 72px}
h1{font-size:clamp(26px,4vw,38px);font-weight:650;letter-spacing:-.02em;margin-bottom:4px}
.lead{color:var(--muted);margin-bottom:16px;max-width:880px;line-height:1.45;font-size:14px}
.topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.live{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 rgba(42,107,69,.5);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(42,107,69,.45)}70%{box-shadow:0 0 0 10px rgba(42,107,69,0)}100%{box-shadow:0 0 0 0 rgba(42,107,69,0)}}
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px;margin-bottom:12px;background:var(--card);border:1px solid var(--line);padding:12px;border-radius:10px}
.filters label{display:flex;flex-direction:column;gap:3px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.filters input,.filters select{font:inherit;padding:7px 9px;border:1px solid var(--line);background:#fff;color:var(--ink);text-transform:none;letter-spacing:0;font-size:13px;border-radius:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
button,.btn{font:inherit;padding:9px 14px;border:1px solid #1a1714;background:#1a1714;color:#f7f1e8;cursor:pointer;text-decoration:none;display:inline-block;border-radius:8px;font-size:13px}
button.secondary,.btn.secondary{background:transparent;color:var(--ink)}
.err{color:#8a3a2a;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 14px 12px}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted);margin-top:2px}
.kpi .s{font-size:12px;margin-top:6px;color:var(--accent)}
.grid{display:grid;gap:12px}
.charts{display:grid;gap:12px;margin-bottom:12px}
.charts-top{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:980px){.charts-top{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);padding:14px;border-radius:10px}
.card h2{font-size:16px;font-weight:650;margin-bottom:8px}
.meta{color:var(--muted);font-size:12px;margin-bottom:10px;line-height:1.45}
.pill{display:inline-block;padding:2px 8px;border:1px solid var(--line);border-radius:999px;font-size:11px;margin:0 6px 6px 0;background:#fff}

/* Classic trapezoid funnel */
.vfunnel{display:flex;flex-direction:column;align-items:center;gap:0;padding:4px 0 8px}
.vstep{position:relative;width:100%;display:flex;flex-direction:column;align-items:center}
.vtrap{
  position:relative;display:flex;align-items:center;justify-content:center;
  color:#f7f1e8;text-align:center;padding:10px 16px;min-height:44px;
  clip-path:polygon(var(--inl,0%) 0%, calc(100% - var(--inr,0%)) 0%, calc(100% - var(--outr,0%)) 100%, var(--outl,0%) 100%);
  background:linear-gradient(180deg,rgba(255,255,255,.14),transparent), var(--c,#1f4d6e);
  transition:filter .2s ease;
}
.vtrap:hover{filter:brightness(1.06)}
.vtrap .vt-main{font-size:13px;font-weight:650;line-height:1.2}
.vtrap .vt-sub{font-size:11px;opacity:.88;margin-top:2px;font-variant-numeric:tabular-nums}
.vdrop{
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:11px;color:var(--muted);padding:3px 0 2px;font-variant-numeric:tabular-nums;
}
.vdrop .arrow{color:var(--drop);font-weight:600}
.vdrop .keep{color:var(--good)}

/* Dual good/bad funnels — row-aligned */
.dual{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px 16px;
  align-items:stretch;
}
.dual-head{
  display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;
  border:1px solid var(--line);background:#fff;
}
.dual-head.bad{border-color:rgba(154,91,32,.35);background:rgba(154,91,32,.06)}
.dual-head.good{border-color:rgba(42,107,69,.35);background:rgba(42,107,69,.07)}
.dual-head .ht{font-size:14px;font-weight:650}
.dual-head .hs{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.dual-row{
  display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;
  grid-column:1 / -1;align-items:stretch;
}
.dual-stage{
  display:flex;flex-direction:column;gap:6px;min-width:0;
}
.dual-bar{
  position:relative;margin:0 auto;width:100%;
  display:flex;align-items:center;justify-content:center;
  color:#f7f1e8;text-align:center;padding:12px 14px;min-height:52px;
  clip-path:polygon(var(--inl,0%) 0%, calc(100% - var(--inr,0%)) 0%, calc(100% - var(--outr,0%)) 100%, var(--outl,0%) 100%);
  background:linear-gradient(180deg,rgba(255,255,255,.12),transparent), var(--c,#9a5b20);
}
.dual-bar .nm{font-size:13px;font-weight:650;line-height:1.2}
.dual-bar .cnt{font-size:12px;opacity:.92;margin-top:2px;font-variant-numeric:tabular-nums}
.dual-stats{
  display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;
  font-size:11px;font-variant-numeric:tabular-nums;line-height:1.35;
  padding:0 2px;
}
.dual-stats .k{color:var(--muted)}
.dual-stats .v{color:var(--ink)}
.dual-stats .full{grid-column:1 / -1}
.dual-time{
  font-size:11px;color:var(--muted);line-height:1.4;padding:6px 8px;
  background:rgba(26,23,20,.04);border-radius:6px;font-variant-numeric:tabular-nums;
}
.dual-time strong{color:var(--ink);font-weight:600}
.dual-bridge{
  display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;
  grid-column:1 / -1;font-size:11px;color:var(--muted);
  font-variant-numeric:tabular-nums;padding:0 2px 2px;
}
.dual-bridge span{display:block;text-align:center}
.dual-bridge .keep{color:var(--good)}
.dual-bridge .lose{color:var(--drop)}
@media(max-width:720px){
  .dual,.dual-row,.dual-bridge{grid-template-columns:1fr}
  .dual-head.good{order:2}
}

/* Conversion cards */
.conv-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.conv-grid{grid-template-columns:1fr}}
.conv{
  border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff;
  display:flex;flex-direction:column;gap:6px;
}
.conv .ctitle{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.conv .crate{font-size:28px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.conv .crate.good{color:var(--good)}
.conv .cmeta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.conv .cbar{height:8px;background:rgba(26,23,20,.07);border-radius:999px;overflow:hidden;margin-top:4px}
.conv .cfill{height:100%;border-radius:999px;background:var(--bar2);transition:width .35s ease}
.conv .cfill.mid{background:var(--accent)}
.conv .cfill.warn{background:var(--warn)}

table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border-bottom:1px solid var(--line);padding:7px 5px;text-align:left;vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:10px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;user-select:none}
th:hover{color:var(--ink)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.good{color:var(--good)}
.visits details{margin-top:4px}
.visits summary{cursor:pointer}
pre{white-space:pre-wrap;font-size:11px;line-height:1.4;background:#f4eee6;padding:8px;border:1px solid var(--line);border-radius:6px;max-height:280px;overflow:auto}
.sec-reach{display:inline-flex;gap:3px;flex-wrap:wrap}
.dot-s{width:8px;height:8px;border-radius:2px;background:rgba(26,23,20,.12)}
.dot-s.on{background:var(--good)}
</style>
</head>
<body>
  <div class="topbar">
    <div>
      <h1>Поведение на лендинге</h1>
      <p class="lead">Воронка секций и конверсии. Фильтры применяются сразу. «Автообновление 10 с» — страница сама перезапрашивает данные каждые 10 секунд.</p>
    </div>
    <div class="live"><span class="dot" aria-hidden="true"></span><span id="liveLabel">обновление…</span></div>
  </div>

  <form id="filters" class="filters">
    <label>С даты<input type="date" name="date_from"></label>
    <label>По дату<input type="date" name="date_to"></label>
    <label>utm_source<select name="utm_source"><option value="">все</option></select></label>
    <label>utm_medium<select name="utm_medium"><option value="">все</option></select></label>
    <label>utm_campaign<select name="utm_campaign"><option value="">все</option></select></label>
    <label>utm_content<select name="utm_content"><option value="">все</option></select></label>
    <label>utm_term<select name="utm_term"><option value="">все</option></select></label>
    <label>bot_started
      <select name="bot_started">
        <option value="">все</option>
        <option value="1">да</option>
        <option value="0">нет</option>
      </select>
    </label>
    <label>clicked_telegram
      <select name="clicked_telegram">
        <option value="">все</option>
        <option value="1">да</option>
        <option value="0">нет</option>
      </select>
    </label>
    <label>дошли до секции<select name="reached_section"><option value="">любая</option></select></label>
    <label>yclid
      <select name="has_yclid">
        <option value="">все</option>
        <option value="1">есть</option>
        <option value="0">нет</option>
      </select>
    </label>
    <label>поиск<input type="search" name="q" placeholder="session / cid / term…"></label>
    <label>группировка
      <select name="group_by">
        <option value="utm_content">объявление</option>
        <option value="utm_campaign">кампания</option>
        <option value="utm_source">source</option>
        <option value="utm_medium">medium</option>
        <option value="utm_term">ключ</option>
        <option value="bot_started">bot_started</option>
        <option value="clicked_telegram">clicked_telegram</option>
        <option value="day">день</option>
        <option value="none">без групп</option>
      </select>
    </label>
    <label>сортировка
      <select name="sort">
        <option value="created_at">создан</option>
        <option value="updated_at">обновлён</option>
        <option value="page_ms">время на сайте</option>
        <option value="bot_started">bot_started</option>
        <option value="clicked_telegram">click TG</option>
        <option value="utm_content">объявление</option>
        <option value="utm_campaign">кампания</option>
        <option value="utm_term">ключ</option>
      </select>
    </label>
    <label>порядок
      <select name="order">
        <option value="desc">новые сверху</option>
        <option value="asc">старые сверху</option>
      </select>
    </label>
    <label>лимит визитов<input type="number" name="limit" value="500" min="1" max="5000"></label>
  </form>

  <div class="actions">
    <button type="button" class="secondary" id="reset">Сбросить</button>
    <a class="btn secondary" id="export" href="#">Скачать .txt</a>
    <label style="font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-left:4px" title="Страница сама перезапрашивает статистику каждые 10 секунд">
      <input type="checkbox" id="autorefresh" checked> автообновление 10 с
    </label>
  </div>
  <div id="err" class="err" hidden></div>
  <div id="kpis" class="kpis"></div>
  <div id="charts" class="charts"></div>
  <div id="out" class="grid"></div>

<script>
const form = document.getElementById("filters");
const errEl = document.getElementById("err");
const outEl = document.getElementById("out");
const kpisEl = document.getElementById("kpis");
const chartsEl = document.getElementById("charts");
const exportEl = document.getElementById("export");
const liveLabel = document.getElementById("liveLabel");
let sectionSort = {key: "order", dir: "asc"};
let timer = null;
let debounceTimer = null;
let loadSeq = 0;

const FUNNEL_COLORS = [
  "#1f4d6e","#245a7e","#29678e","#2e749e","#3480a8",
  "#3a8cb0","#4097b5","#4a9eaa","#52a49c","#5aa88a","#5eab78"
];

function params(){
  const fd = new FormData(form);
  const p = new URLSearchParams();
  for (const [k, v] of fd.entries()) {
    if (String(v).trim() !== "") p.set(k, String(v).trim());
  }
  return p;
}

function fillSelect(name, values, keepEmptyLabel){
  const el = form.elements.namedItem(name);
  if (!el) return;
  const current = el.value;
  el.innerHTML = `<option value="">${keepEmptyLabel || "все"}</option>` +
    values.map(v => `<option value="${escapeAttr(v)}">${escapeHtml(v)}</option>`).join("");
  if ([...el.options].some(o => o.value === current)) el.value = current;
}

function fillSections(sections){
  const el = form.elements.namedItem("reached_section");
  const current = el.value;
  el.innerHTML = `<option value="">любая</option>` +
    sections.map(s => `<option value="${escapeAttr(s.key)}">${escapeHtml(s.label)}</option>`).join("");
  if ([...el.options].some(o => o.value === current)) el.value = current;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

function fmt(m){
  if (!m || !m.n) return "—";
  return `avg ${m.avg} · med ${m.median} · min ${m.min} · max ${m.max}`;
}
function pct(x){ return Math.round((x || 0) * 100); }
function pct1(num, den){
  if (!den) return 0;
  return Math.round((num / den) * 1000) / 10;
}
function pctLabel(num, den){
  return pct1(num, den).toLocaleString("ru-RU", {maximumFractionDigits: 1}) + "%";
}

function sectionRows(sections){
  const order = ["top","one","feel","recognize","manifesto","method","author","results","inside","not_for","purchase"];
  let rows = [...(sections || [])];
  if (sectionSort.key === "order") {
    rows.sort((a,b) => order.indexOf(a.key) - order.indexOf(b.key));
  } else if (sectionSort.key === "reach") {
    rows.sort((a,b) => (a.reached_count - b.reached_count) * (sectionSort.dir === "asc" ? 1 : -1));
  } else if (sectionSort.key === "tt") {
    rows.sort((a,b) => ((a.time_to_sec?.avg ?? -1) - (b.time_to_sec?.avg ?? -1)) * (sectionSort.dir === "asc" ? 1 : -1));
  } else if (sectionSort.key === "dw") {
    rows.sort((a,b) => ((a.dwell_sec?.avg ?? -1) - (b.dwell_sec?.avg ?? -1)) * (sectionSort.dir === "asc" ? 1 : -1));
  }
  return rows.map(s => `
    <tr>
      <td>${escapeHtml(s.label)}<div class="meta">${escapeHtml(s.key)}</div></td>
      <td class="num">${s.reached_count} <span class="meta">(${pct(s.reached_rate)}%)</span></td>
      <td class="num">${fmt(s.time_to_sec)}</td>
      <td class="num">${fmt(s.dwell_sec)}</td>
    </tr>`).join("");
}

function sectionTable(sections){
  return `<table>
    <thead><tr>
      <th data-ssort="order">Секция</th>
      <th data-ssort="reach">Дошли</th>
      <th data-ssort="tt">time_to, сек</th>
      <th data-ssort="dw">dwell, сек</th>
    </tr></thead>
    <tbody>${sectionRows(sections)}</tbody>
  </table>`;
}

function renderKpis(data){
  const t = data.totals || {};
  const visits = t.visits || 0;
  const clicked = t.clicked_telegram || 0;
  const bots = t.bot_started || 0;
  kpisEl.innerHTML = `
    <div class="kpi"><div class="v">${visits}</div><div class="l">Визитов</div><div class="s">в БД ${data.visits_total_db}</div></div>
    <div class="kpi"><div class="v">${pct(t.click_rate)}%</div><div class="l">Клик в Telegram</div><div class="s">${clicked} чел. · ${pctLabel(clicked, visits)} от визитов</div></div>
    <div class="kpi"><div class="v good">${pct(t.bot_rate)}%</div><div class="l">Старт бота</div><div class="s">${bots} чел. · ${pctLabel(bots, clicked || 1)} от клика TG</div></div>
    <div class="kpi"><div class="v">${t.page_sec?.avg != null ? t.page_sec.avg + " с" : "—"}</div><div class="l">Среднее время на сайте</div><div class="s">med ${t.page_sec?.median ?? "—"}</div></div>
  `;
}

function visualFunnel(sections, visits, pageSec){
  const steps = [
    {key: "_visits", label: "Визиты", count: visits || 0, time: pageSec || null},
    ...(sections || []).map(s => ({
      key: s.key,
      label: s.label,
      count: s.reached_count || 0,
      time: s.time_to_sec || null
    }))
  ];
  const n = Math.max(steps.length - 1, 1);
  const maxInset = 38;

  let html = `<div class="vfunnel">`;
  for (let i = 0; i < steps.length; i++) {
    const s = steps[i];
    const prev = i > 0 ? steps[i - 1] : null;
    const inset = (i / n) * maxInset;
    const nextInset = ((i + 1) / n) * maxInset;
    const inl = inset / 2;
    const inr = inset / 2;
    const outl = i < steps.length - 1 ? nextInset / 2 : inset / 2 + 2;
    const outr = i < steps.length - 1 ? nextInset / 2 : inset / 2 + 2;
    const ofTotal = pctLabel(s.count, visits || 1);
    const ofPrev = prev ? pctLabel(s.count, prev.count || 1) : "100%";
    const color = i === 0 ? "#1a1714" : FUNNEL_COLORS[Math.min(i - 1, FUNNEL_COLORS.length - 1)];

    html += `<div class="vstep">
      <div class="vtrap" style="--inl:${inl}%;--inr:${inr}%;--outl:${outl}%;--outr:${outr}%;--c:${color};width:100%">
        <div>
          <div class="vt-main">${escapeHtml(s.label)}</div>
          <div class="vt-sub">${s.count} · ${ofTotal} от всех · ${ofPrev} от пред.</div>
          <div class="vt-sub">${fmtTimeShort(s.time)}</div>
        </div>
      </div>`;

    if (i < steps.length - 1) {
      const next = steps[i + 1];
      const keep = pctLabel(next.count, s.count || 1);
      const drop = s.count ? pct1(s.count - next.count, s.count) : 0;
      html += `<div class="vdrop">
        <span class="keep">→ ${keep} дальше</span>
        <span class="arrow">↓ −${drop.toLocaleString("ru-RU", {maximumFractionDigits: 1})}% отсев</span>
      </div>`;
    }
    html += `</div>`;
  }
  html += `</div>`;
  return html;
}

function fmtTimeShort(m){
  if (!m || !m.n) return "time: —";
  return `time: min ${m.min} · max ${m.max} · avg ${m.avg} · med ${m.median}`;
}

function fmtTimeBlock(m){
  if (!m || !m.n) return `<div class="dual-time"><strong>time:</strong> нет данных</div>`;
  return `<div class="dual-time"><strong>time (сек):</strong> min ${m.min} · max ${m.max} · avg ${m.avg} · median ${m.median}</div>`;
}

function buildSteps(block){
  const visits = block.visits || 0;
  return [
    {
      key: "_visits",
      label: "Визиты",
      count: visits,
      time: block.page_sec || null
    },
    ...(block.sections || []).map(s => ({
      key: s.key,
      label: s.label,
      count: s.reached_count || 0,
      time: s.time_to_sec || null
    }))
  ];
}

function dualStageCell(step, prev, total, color, index, totalSteps){
  const n = Math.max(totalSteps - 1, 1);
  const inset = (index / n) * 36;
  const nextInset = ((index + 1) / n) * 36;
  const inl = inset / 2;
  const inr = inset / 2;
  const outl = index < totalSteps - 1 ? nextInset / 2 : inset / 2 + 2;
  const outr = index < totalSteps - 1 ? nextInset / 2 : inset / 2 + 2;
  const ofTotal = pctLabel(step.count, total || 1);
  const ofPrev = prev ? pctLabel(step.count, prev.count || 1) : "100%";

  return `<div class="dual-stage">
    <div class="dual-bar" style="--inl:${inl}%;--inr:${inr}%;--outl:${outl}%;--outr:${outr}%;--c:${color}">
      <div>
        <div class="nm">${escapeHtml(step.label)}</div>
        <div class="cnt">${step.count} чел.</div>
      </div>
    </div>
    <div class="dual-stats">
      <div><span class="k">кол-во</span><br><span class="v">${step.count}</span></div>
      <div><span class="k">от всех</span><br><span class="v">${ofTotal}</span></div>
      <div class="full"><span class="k">от предыдущего этапа</span><br><span class="v">${ofPrev}</span></div>
    </div>
    ${fmtTimeBlock(step.time)}
  </div>`;
}

function dualFunnelsHtml(data){
  const bad = data.by_telegram?.not_bot_started || {};
  const good = data.by_telegram?.bot_started || {};
  const badSteps = buildSteps(bad);
  const goodSteps = buildSteps(good);
  const len = Math.max(badSteps.length, goodSteps.length);
  const badColors = ["#6b4423","#7a4d28","#8a572e","#9a5b20","#a8672c","#b47338","#be7f44","#c68b50","#cc9660","#d2a070","#d8aa80"];
  const goodColors = ["#1f4d3a","#246348","#2a6b45","#317850","#38855b","#409266","#489e70","#50a87a","#58b284","#60bc8e","#68c698"];

  let html = `<div class="dual">
    <div class="dual-head bad">
      <div class="ht">Плохие · без /start</div>
      <div class="hs">${bad.visits || 0} визитов · клик TG ${pct(bad.click_rate)}%</div>
    </div>
    <div class="dual-head good">
      <div class="ht">Хорошие · bot_started</div>
      <div class="hs">${good.visits || 0} визитов · клик TG ${pct(good.click_rate)}%</div>
    </div>`;

  for (let i = 0; i < len; i++) {
    const b = badSteps[i] || {key: "_", label: "—", count: 0, time: null};
    const g = goodSteps[i] || {key: "_", label: "—", count: 0, time: null};
    const bPrev = i > 0 ? badSteps[i - 1] : null;
    const gPrev = i > 0 ? goodSteps[i - 1] : null;
    const bColor = i === 0 ? "#5c3d22" : badColors[Math.min(i - 1, badColors.length - 1)];
    const gColor = i === 0 ? "#1a3d2e" : goodColors[Math.min(i - 1, goodColors.length - 1)];

    html += `<div class="dual-row">
      ${dualStageCell(b, bPrev, bad.visits || 0, bColor, i, len)}
      ${dualStageCell(g, gPrev, good.visits || 0, gColor, i, len)}
    </div>`;

    if (i < len - 1) {
      const bNext = badSteps[i + 1] || {count: 0};
      const gNext = goodSteps[i + 1] || {count: 0};
      const bKeep = pctLabel(bNext.count, b.count || 1);
      const gKeep = pctLabel(gNext.count, g.count || 1);
      const bDrop = b.count ? pct1(b.count - bNext.count, b.count) : 0;
      const gDrop = g.count ? pct1(g.count - gNext.count, g.count) : 0;
      html += `<div class="dual-bridge">
        <span><span class="keep">→ ${bKeep} дальше</span> · <span class="lose">−${bDrop.toLocaleString("ru-RU", {maximumFractionDigits: 1})}% отсев</span></span>
        <span><span class="keep">→ ${gKeep} дальше</span> · <span class="lose">−${gDrop.toLocaleString("ru-RU", {maximumFractionDigits: 1})}% отсев</span></span>
      </div>`;
    }
  }

  html += `</div>`;
  return html;
}

function convCard(title, ratePct, count, baseLabel, fillClass){
  const w = Math.max(0, Math.min(100, ratePct));
  return `<div class="conv">
    <div class="ctitle">${escapeHtml(title)}</div>
    <div class="crate${ratePct >= 20 ? " good" : ""}">${ratePct.toLocaleString("ru-RU", {maximumFractionDigits: 1})}%</div>
    <div class="cmeta">${count} чел. · ${escapeHtml(baseLabel)}</div>
    <div class="cbar"><div class="cfill ${fillClass || ""}" style="width:${w}%"></div></div>
  </div>`;
}

function conversionsHtml(data){
  const t = data.totals || {};
  const visits = t.visits || 0;
  const clicked = t.clicked_telegram || 0;
  const bots = t.bot_started || 0;
  const purchase = (t.sections || []).find(s => s.key === "purchase");
  const purchaseN = purchase?.reached_count || 0;
  const mid = (t.sections || []).find(s => s.key === "method");
  const midN = mid?.reached_count || 0;

  const clickPct = pct1(clicked, visits);
  const botPct = pct1(bots, visits);
  const clickToBot = pct1(bots, clicked);
  const purchasePct = pct1(purchaseN, visits);
  const midPct = pct1(midN, visits);
  const purchaseToClick = pct1(clicked, purchaseN);

  return `<div class="conv-grid">
    ${convCard("Визит → клик Telegram", clickPct, clicked, `из ${visits} визитов`, "mid")}
    ${convCard("Визит → старт бота", botPct, bots, `из ${visits} визитов`)}
    ${convCard("Клик TG → старт бота", clickToBot, bots, `из ${clicked} кликов`)}
    ${convCard("Визит → секция оплаты", purchasePct, purchaseN, `из ${visits} визитов`, "warn")}
    ${convCard("Визит → метод", midPct, midN, `из ${visits} визитов`, "mid")}
    ${convCard("Оплата → клик TG", purchaseToClick, clicked, `из ${purchaseN} дошедших`, "warn")}
  </div>`;
}

function renderCharts(data){
  const t = data.totals || {};
  chartsEl.innerHTML = `
    <section class="card">
      <h2>Воронки: плохие и хорошие</h2>
      <p class="meta">Слева — без /start, справа — bot_started. Этапы на одном уровне. На каждом: количество, % от всех в группе, % от предыдущего этапа, time min/max/avg/median.</p>
      ${dualFunnelsHtml(data)}
    </section>
    <div class="charts-top">
      <section class="card">
        <h2>Общая воронка</h2>
        <p class="meta">Все визиты после фильтров</p>
        ${visualFunnel(t.sections || [], t.visits || 0, t.page_sec)}
      </section>
      <section class="card">
        <h2>Конверсии</h2>
        <p class="meta">Ключевые переходы с процентами</p>
        ${conversionsHtml(data)}
      </section>
    </div>`;
}

function block(title, data, extra=""){
  if (!data) return "";
  return `<section class="card">
    <h2>${escapeHtml(title)}</h2>
    <div class="meta">
      <span class="pill">визитов ${data.visits}</span>
      <span class="pill">клик TG ${data.clicked_telegram} (${pct(data.click_rate)}%)</span>
      <span class="pill good">bot ${data.bot_started} (${pct(data.bot_rate)}%)</span>
      <span class="pill">page: ${fmt(data.page_sec)}</span>
      ${extra}
    </div>
    ${sectionTable(data.sections || [])}
  </section>`;
}

function reachDots(sections){
  const order = ["top","one","feel","recognize","manifesto","method","author","results","inside","not_for","purchase"];
  const map = Object.fromEntries((sections || []).map(s => [s.key, s]));
  return `<div class="sec-reach" title="доскролл по секциям">${order.map(k => {
    const on = map[k] && map[k].reached;
    return `<span class="dot-s${on ? " on" : ""}" title="${escapeAttr((map[k]&&map[k].label)||k)}"></span>`;
  }).join("")}</div>`;
}

function visitTable(visits){
  if (!visits?.length) return `<section class="card"><h2>Визиты</h2><p class="meta">Нет строк</p></section>`;
  const rows = visits.map(v => `
    <tr>
      <td class="num">${escapeHtml((v.created_at || "").replace("T"," ").slice(0,19))}</td>
      <td>${escapeHtml(v.utm_campaign || "—")}<div class="meta">${escapeHtml(v.utm_content || "")}</div></td>
      <td>${escapeHtml(v.utm_term || "—")}</td>
      <td class="num">${v.clicked_telegram ? "да" : "нет"} / ${v.bot_started ? '<span class="good">да</span>' : "нет"}</td>
      <td class="num">${v.page_sec ?? "—"}</td>
      <td>${reachDots(v.sections)}</td>
      <td>
        <details class="visits">
          <summary>${escapeHtml(v.session_id)}</summary>
          <pre>${escapeHtml(JSON.stringify(v, null, 2))}</pre>
        </details>
      </td>
    </tr>`).join("");
  return `<section class="card">
    <h2>Визиты</h2>
    <p class="meta">Зелёные точки — до какой секции доскроллил. Раскрой session для JSON.</p>
    <table>
      <thead><tr>
        <th>время UTC</th><th>кампания / объявление</th><th>ключ</th>
        <th>TG / bot</th><th>сек</th><th>путь</th><th>session</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </section>`;
}

function bindSectionSort(){
  outEl.querySelectorAll("th[data-ssort]").forEach(th => {
    th.addEventListener("click", () => {
      const key = th.getAttribute("data-ssort");
      if (sectionSort.key === key) sectionSort.dir = sectionSort.dir === "asc" ? "desc" : "asc";
      else { sectionSort.key = key; sectionSort.dir = key === "order" ? "asc" : "desc"; }
      render(window.__lastReport);
    });
  });
}

function render(data){
  window.__lastReport = data;
  renderKpis(data);
  renderCharts(data);
  const parts = [];
  parts.push(`<section class="card"><h2>Сводка</h2>
    <div class="meta">
      сгенерировано ${escapeHtml(data.generated_at || "")}<br>
      фильтр: ${data.visits_matched} · показано: ${data.visits_returned}
    </div></section>`);
  (data.groups || []).forEach(g => {
    parts.push(block(`Группа: ${g.group}`, g, `<span class="pill">${escapeHtml(g.group_by || "")}</span>`));
  });
  parts.push(visitTable(data.visits || []));
  outEl.innerHTML = parts.join("");
  bindSectionSort();
}

async function load(silent){
  const seq = ++loadSeq;
  if (!silent) {
    errEl.hidden = true;
    if (!window.__lastReport) outEl.innerHTML = "<p class='meta'>Загрузка…</p>";
  }
  const p = params();
  exportEl.href = "/api/behavior/export.txt?" + p.toString();
  try {
    const r = await fetch("/api/behavior/stats?" + p.toString());
    if (!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();
    if (seq !== loadSeq) return;
    const f = data.facets || {};
    fillSelect("utm_source", f.utm_source || []);
    fillSelect("utm_medium", f.utm_medium || []);
    fillSelect("utm_campaign", f.utm_campaign || []);
    fillSelect("utm_content", f.utm_content || []);
    fillSelect("utm_term", f.utm_term || []);
    fillSections(f.sections || []);
    render(data);
    const now = new Date();
    liveLabel.textContent = "обновлено " + now.toLocaleTimeString("ru-RU");
  } catch (e) {
    if (seq !== loadSeq) return;
    if (!silent) {
      errEl.hidden = false;
      errEl.textContent = String(e.message || e);
    }
    liveLabel.textContent = "ошибка обновления";
  }
}

function schedule(){
  if (timer) clearInterval(timer);
  timer = null;
  if (document.getElementById("autorefresh").checked) {
    timer = setInterval(() => load(true), 10000);
  }
}

function applyFiltersNow(){
  if (debounceTimer) clearTimeout(debounceTimer);
  debounceTimer = null;
  load(false);
}

function applyFiltersDebounced(){
  if (debounceTimer) clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => load(false), 350);
}

form.addEventListener("change", e => {
  const t = e.target;
  if (!t || !t.name) return;
  if (t.name === "q" || t.name === "limit") return;
  applyFiltersNow();
});
form.addEventListener("input", e => {
  const t = e.target;
  if (!t || !t.name) return;
  if (t.name === "q" || t.name === "limit" || t.type === "date") {
    applyFiltersDebounced();
  }
});

document.getElementById("reset").addEventListener("click", () => {
  form.reset();
  form.elements.namedItem("limit").value = "500";
  form.elements.namedItem("group_by").value = "utm_content";
  applyFiltersNow();
});
document.getElementById("autorefresh").addEventListener("change", schedule);
form.addEventListener("submit", e => { e.preventDefault(); applyFiltersNow(); });
load(false);
schedule();
</script>
</body>
</html>
