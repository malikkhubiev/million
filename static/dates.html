<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Даты набора</title>
<style>
:root{
  --bg:#f3efe8;--ink:#1a1714;--muted:#6e675e;--line:rgba(26,23,20,.12);
  --card:#fffcf7;--good:#2a6b45;--bad:#8a3a2a;--accent:#1f4d6e;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,sans-serif;background:
  radial-gradient(900px 400px at 10% -10%,rgba(31,77,110,.08),transparent),
  radial-gradient(700px 360px at 100% 0%,rgba(42,107,69,.07),transparent),
  var(--bg);color:var(--ink);padding:20px 14px 72px}
h1{font-size:clamp(26px,4vw,38px);font-weight:650;letter-spacing:-.02em;margin-bottom:4px}
.lead{color:var(--muted);margin-bottom:18px;max-width:640px;line-height:1.45;font-size:14px}
.admin-nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.admin-nav a{
  font:inherit;padding:7px 12px;border:1px solid var(--line);border-radius:8px;
  text-decoration:none;color:var(--muted);background:var(--card);font-size:13px;
}
.admin-nav a:hover{color:var(--ink);border-color:rgba(26,23,20,.25)}
.admin-nav a.active{background:#1a1714;color:#f7f1e8;border-color:#1a1714}
.panel{
  max-width:480px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:20px 18px 18px;
}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input{
  font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
  background:#fff;font-size:16px;font-variant-numeric:tabular-nums;
}
.hint{font-size:12px;color:var(--muted);line-height:1.4}
.preview{
  margin:16px 0 0;padding:12px 14px;border-radius:8px;
  background:rgba(26,23,20,.03);border:1px solid var(--line);font-size:13px;line-height:1.5;
}
.preview b{font-weight:650}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
button{font:inherit;padding:9px 14px;border:1px solid #1a1714;background:#1a1714;color:#f7f1e8;cursor:pointer;border-radius:8px;font-size:13px}
button.secondary{background:transparent;color:var(--ink)}
.err{color:var(--bad);margin:12px 0 0;font-size:13px}
.ok{color:var(--good);margin:12px 0 0;font-size:13px}
</style>
</head>
<body>
<nav class="admin-nav" aria-label="Разделы">
  <a href="/">Меню</a>
  <a href="/admin/behavior">Дашборд</a>
  <a href="/admin/payments">Клиенты</a>
  <a class="active" href="/admin/dates">Даты</a>
</nav>

<h1>Даты набора</h1>
<p class="lead">Два значения в базе. От них подстраиваются тексты на сайте, таймер, сообщения в боте. Формат: <b>ДД.ММ.ГГГГ</b>.</p>

<div class="panel">
  <form id="form">
    <div class="field">
      <label for="enrollment_end">Дата окончания набора</label>
      <input id="enrollment_end" name="enrollment_end" type="text" inputmode="numeric" placeholder="10.10.2026" autocomplete="off" required>
      <span class="hint">Последний день приёма оплат. Таймер считает до 23:59 МСК этого дня.</span>
    </div>
    <div class="field">
      <label for="transformation_start">Дата начала трансформации</label>
      <input id="transformation_start" name="transformation_start" type="text" inputmode="numeric" placeholder="20.10.2026" autocomplete="off" required>
      <span class="hint">Старт публикации материалов / текст «трансформация начинается…» в боте.</span>
    </div>
    <div class="preview" id="preview">Загрузка…</div>
    <div class="actions">
      <button type="submit">Сохранить</button>
      <button type="button" class="secondary" id="btnReload">Отменить</button>
    </div>
    <div class="err" id="err" hidden></div>
    <div class="ok" id="msg" hidden></div>
  </form>
</div>

<script>
const $ = (id) => document.getElementById(id);
const err = $("err");
const msg = $("msg");

function showErr(t) { err.hidden = !t; err.textContent = t || ""; }
function showMsg(t) { msg.hidden = !t; msg.textContent = t || ""; }

function fill(data) {
  $("enrollment_end").value = data.enrollment_end || "";
  $("transformation_start").value = data.transformation_start || "";
  $("preview").innerHTML =
    `<b>На сайте:</b> ${data.meta_line || "—"}<br>` +
    `<b>Таймер до:</b> ${data.countdown_deadline || "—"}`;
}

async function load() {
  showErr("");
  const r = await fetch("/api/dates");
  if (!r.ok) throw new Error("HTTP " + r.status);
  const data = await r.json();
  fill(data);
}

$("btnReload").onclick = () => {
  showMsg("");
  load().catch((e) => showErr(String(e.message || e)));
};

$("form").onsubmit = async (ev) => {
  ev.preventDefault();
  showErr("");
  showMsg("");
  const body = {
    enrollment_end: $("enrollment_end").value.trim(),
    transformation_start: $("transformation_start").value.trim(),
  };
  try {
    const r = await fetch("/api/dates", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) {
      const detail = data.detail;
      throw new Error(typeof detail === "string" ? detail : (detail && JSON.stringify(detail)) || "ошибка сохранения");
    }
    fill(data);
    showMsg("Сохранено. Сайт и бот подхватят новые даты.");
  } catch (e) {
    showErr(String(e.message || e));
  }
};

load().catch((e) => {
  showErr(String(e.message || e));
  $("preview").textContent = "Не удалось загрузить";
});
</script>
</body>
</html>
